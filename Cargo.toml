[package]
name = "bumper"
version = "0.35.0"
edition = "2024"
rust-version = "1.95.0"
description = "Git semantic version bumper"
readme = "README.md"
repository = "https://trev.zip/llc/bumper"
license-file = "LICENSE"

[[bin]]
name = "bumper"
path = "src/main.rs"

[lints.clippy]
# erm, actually
pedantic = { level = "warn", priority = -1 }
# deny panics
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
unreachable = "warn"
unimplemented = "warn"
unchecked_time_subtraction = "warn"
todo = "warn"
string_slice = "warn"
panic_in_result_fn = "warn"
panic = "warn"
exit = "warn"
as_conversions = "warn"

[dependencies]
clap = { version = "4", features = ["derive"] }
git2 = { version = "0.21.0", features = ["https", "ssh"] }
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"
